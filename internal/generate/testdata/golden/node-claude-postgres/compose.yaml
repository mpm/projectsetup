# Generated by projectsetup. Edit projectsetup.json and regenerate instead of editing this file.
name: node-postgres

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    user: vscode
    volumes:
      - ..:/workspaces/node-postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectsetup
      POSTGRES_PASSWORD: projectsetup
      POSTGRES_DB: 'node-postgres'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectsetup -d node-postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
