schema = 1
kind = "preset"
name = "ruby"
version = "1.0.0"
description = "Ruby with Bundler, for gems and non-Rails applications"

[options.version]
description = "Ruby version"
default = "4.0"
pattern = '[0-9]+(\.[0-9]+){0,2}([-+][a-zA-Z0-9.-]+)?'

[options.version.detect]
sources = [
  { file = ".ruby-version" },
  { file = "Gemfile", pattern = '''(?m)^\s*ruby\s*(?:\(\s*)?["'](?:ruby-)?v?([0-9]+(?:\.[0-9]+){1,2}(?:[-+][0-9A-Za-z.-]+)?)["']''' },
]

# Without match rules, any present signal detects the preset.
[detect]
signals = ["Gemfile", "Gemfile.lock", ".ruby-version", "*.gemspec"]

[image]
base = "mcr.microsoft.com/devcontainers/base:ubuntu-24.04"

[features."ghcr.io/rails/devcontainer/features/ruby:2"]
version = "${option:version}"
usePrecompiledRubies = true

# The Ruby feature installs through mise; dworm exec needs its shims on PATH.
[container]
path = ["${project:home}/.local/share/mise/shims"]

[setup]
script = '''
if [[ -f Gemfile ]]; then
  bundle install
fi
'''
