schema = 1
kind = "preset"
name = "rails"
version = "1.0.0"
description = "Ruby on Rails with Bundler, Node, and Active Storage support"

[options.version]
description = "Ruby version"
default = "4.0"
pattern = '[0-9]+(\.[0-9]+){0,2}([-+][a-zA-Z0-9.-]+)?'

[options.version.detect]
sources = [
  { file = ".ruby-version" },
  { file = "Gemfile", pattern = '''(?m)^\s*ruby\s*(?:\(\s*)?["'](?:ruby-)?v?([0-9]+(?:\.[0-9]+){1,2}(?:[-+][0-9A-Za-z.-]+)?)["']''' },
]

# Rails projects also look like Ruby projects; only Rails evidence counts.
[detect]
signals = ["Gemfile", "bin/rails", "config/application.rb", ".ruby-version", "Gemfile.lock"]
match = [
  { file = "bin/rails" },
  { file = "config/application.rb" },
  { file = "Gemfile", pattern = '''(?m)^\s*gem\s+["']rails["']''' },
]
supersedes = ["ruby"]

[[detect.suggest]]
addon = "postgres"
match = [{ file = "config/database.yml", pattern = '(?m)^\s*adapter:\s*(postgresql|postgis)\s*(?:#.*)?$' }]

[image]
base = "mcr.microsoft.com/devcontainers/base:ubuntu-24.04"

[features."ghcr.io/rails/devcontainer/features/ruby:2"]
version = "${option:version}"
usePrecompiledRubies = true

[features."ghcr.io/devcontainers/features/node:1"]
version = "lts"

[features."ghcr.io/rails/devcontainer/features/activestorage"]

# The Ruby feature installs through mise and the Node feature through nvm;
# dworm exec needs both on PATH, because the generated containerEnv.PATH
# replaces the features' own PATH changes.
[container]
path = ["${project:home}/.local/share/mise/shims", "/usr/local/share/nvm/current/bin"]

[setup]
script = '''
if [[ -x bin/setup ]]; then
  bin/setup --skip-server
elif [[ -f Gemfile ]]; then
  bundle install
fi
'''

[[variant]]
when = { addon = ["postgres"] }

[variant.features."ghcr.io/rails/devcontainer/features/postgres-client"]
